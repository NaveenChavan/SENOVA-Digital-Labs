    <!-- OneSignal Web Push SDK: loaded after the page is interactive so it
         doesn't compete with first paint. Queued init runs once it loads. -->
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "32c97b03-4a8e-46af-b4d9-a68de293a709",
          // Keeps the user subscribed even after they clear browser data
          autoResubscribe: true,
          // Uncomment the next line only for local development testing:
          // allowLocalhostAsSecureOrigin: true,
          notifyButton: { enable: false }, // We use our own custom NotifyButton
        });
      });
      (function () {
        if (window.__PRERENDER__) return;
        function load() {
          var s = document.createElement("script");
          s.src = "https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";
          s.async = true;
          document.head.appendChild(s);
        }
        // Load on the first interaction, or after a quiet delay, whichever is
        // first. Push prompts are never needed for the first paint.
        var started = false;
        function start() {
          if (started) return;
          started = true;
          load();
        }
        ["pointerdown", "keydown", "scroll", "touchstart"].forEach(function (evt) {
          window.addEventListener(evt, start, { once: true, passive: true });
        });
        window.addEventListener("load", function () {
          setTimeout(start, 6000);
        });
      })();
    </script>
