<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="preload" as="image" href="/assets/logo.webp" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="author" content="SENOVA Digital Labs" />

    <!--
      Route-specific metadata (title, description, canonical, robots, Open
      Graph, Twitter Card) is intentionally NOT set here. react-helmet-async
      only overwrites tags that it itself previously rendered — it does not
      remove or replace static tags already present in this file — so
      keeping any title/description/canonical/OG/Twitter tags here would
      create duplicates alongside every route's <SEO> component
      (src/components/SEO.jsx). Each route is the single source of truth
      for its own metadata. Search engines that execute JavaScript (Google,
      Bing) will see the correct per-route tags after hydration; see the
      Sprint 1 roadmap doc for the prerendering recommendation that
      addresses non-JS crawlers.
    -->

    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "32c97b03-4a8e-46af-b4d9-a68de293a709",
          // Keeps the user subscribed even after they clear browser data
          autoResubscribe: true,
          // Uncomment the next line only for local development testing:
          // allowLocalhostAsSecureOrigin: true,
          notifyButton: { enable: false }, // We use our own custom NotifyButton
        });
      });
    </script>

    <!--
      Static fallback JSON-LD (non-JS crawlers / social scrapers that don't
      execute the client-rendered <SEO> structured data). Contains only
      verified business information. The homepage additionally renders
      Organization + WebSite schema client-side — see src/pages/Home.jsx.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "SENOVA Digital Labs",
        "image": "https://www.senovadigital.xyz/android-chrome-512x512.png",
        "url": "https://www.senovadigital.xyz/",
        "email": "info@senovadigital.xyz",
        "telephone": "+91-9731133425",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Raichur",
          "addressRegion": "Karnataka",
          "addressCountry": "IN"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 16.2076,
          "longitude": 77.3463
        },
        "areaServed": [
          { "@type": "City", "name": "Raichur" },
          { "@type": "Country", "name": "India" },
          { "@type": "Place", "name": "Worldwide" }
        ],
        "sameAs": [
          "https://www.instagram.com/senovadigitallabs",
          "https://www.linkedin.com/in/naveen-chavan-8852a9368/",
          "https://www.linkedin.com/in/shrihari-124323340/"
        ],
        "makesOffer": {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Custom Web Development, SaaS Products & Business Automation"
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
